[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "vectortileserver"
version = "0.1.0"
description = "Dynamic vector tile server for visualizing vectors in Jupyter notebooks"
readme = "README.md"
license = "MIT"
authors = [{ name = "Daniel Guerrero", email = "dfgm2006@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
  "starlette",
  "uvicorn",
  "httpx",
  "colorlog",
  "ipyleaflet",
  "jupyter-loopback[comm]>=0.3.3",
  "pmtiles",
  "shapely",
  "geopandas",
  "mapbox-vector-tile",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/dfguerrerom/vectortileserver"
Repository = "https://github.com/dfguerrerom/vectortileserver"
Changelog = "https://github.com/dfguerrerom/vectortileserver/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "black>=24",
  "nox>=2024.4.15",
  "commitizen>=3.29",
  "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["vectortileserver"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "RUF"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_files = ["vectortileserver/__init__.py:__version__"]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
