name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install nox
      - run: nox -s lint

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # The vector -> PMTiles tests shell out to tippecanoe. Without it they skip,
      # which is how the broken conversion path in issue #2 shipped with green CI.
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: tippecanoe
          create-args: tippecanoe
          init-shell: bash
          cache-environment: true
      - name: Put tippecanoe on PATH
        shell: bash -el {0}
        run: dirname "$(which tippecanoe)" >> "$GITHUB_PATH"
      - name: Verify tippecanoe is available
        run: tippecanoe --version

      - run: python -m pip install nox
      - run: nox -s tests -p ${{ matrix.python-version }}
